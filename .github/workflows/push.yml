name: send-push
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: send-push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 送信プログラム(send.js)の場所を探す
        id: loc
        run: |
          if [ -f push/send.js ]; then
            echo "dir=push" >> "$GITHUB_OUTPUT"
          elif [ -f send.js ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            echo "::error::send.js が見つかりません。リポジトリに send.js を追加してください。"
            ls -R . | head -60
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install firebase-admin@12 web-push@3 --no-audit --no-fund
        working-directory: ${{ steps.loc.outputs.dir }}
      - run: node send.js
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
