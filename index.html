<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bribly</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif;background:#f1f5f9;color:#0f172a}
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(150deg,#1e3a8a,#2563eb 55%,#38bdf8)}

.lg{margin:0 0 4px;font-size:24px;color:#1e3a8a}.sub{margin:0 0 18px;color:#64748b;font-size:13px}
header{background:#1e3a8a;color:#fff;padding:12px 18px;font-weight:800;font-size:19px;display:flex;align-items:center;gap:10px}
main{max-width:760px;margin:0 auto;padding:18px 16px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px;background:#fff;border-top:1px solid #e2e8f0}
nav button{flex:1;padding:13px;border:0;border-radius:10px;background:none;font-size:15px;font-weight:700;color:#64748b}
nav .on{background:#1d4ed8;color:#fff}
h2{margin:6px 0 14px;font-size:22px}
label{font-size:13px;font-weight:700;color:#334155}
input,select,textarea{width:100%;padding:12px;margin:5px 0 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:#2563eb}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{background:#1d4ed8;color:#fff;border:0;padding:12px 18px;border-radius:10px;font-size:15px;font-weight:700;margin:2px;cursor:pointer}
.b.big{display:block;width:100%;padding:15px;font-size:17px;margin:6px 0}
.b.big small{display:block;font-size:11px;font-weight:400;opacity:.92;margin-bottom:2px}
.b.g{background:#e2e8f0;color:#334155}.b.r{background:#dc2626}.b:disabled{background:#cbd5e1;color:#fff;cursor:not-allowed}
.b.ok{background:#dcfce7;color:#166534}
.b.mini{font-size:11px;padding:5px 10px;font-weight:400}
.card{background:#fff;border-radius:14px;padding:16px;margin:10px 0;box-shadow:0 1px 3px #0001}
.it{display:flex;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 3px #0001;cursor:pointer}
.ic{flex:none;width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.ic.f{background:#fef3c7}.ic.f{position:relative}.ic.f svg{width:30px;fill:#d97706}.ic.f .mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;padding-top:4px}.ic.pdf{background:#fee2e2;color:#b91c1c}.ic.text{background:#dbeafe;color:#1d4ed8}
.s{font-size:12px;color:#64748b}.err{color:#dc2626;font-size:13px;min-height:18px;margin:6px 0}.red{color:#dc2626;font-weight:800}
.chip{color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700;margin-right:8px}
.or{text-align:center;color:#94a3b8;font-size:12px;margin:14px 0 6px}
details{background:#fff;border-radius:14px;margin:10px 0;padding:0 16px;box-shadow:0 1px 3px #0001}
summary{padding:16px 0;font-weight:700;cursor:pointer;list-style:none}summary::after{content:"＋";float:right;color:#94a3b8}details[open] summary::after{content:"－"}
dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px;font-size:14px}dt{color:#64748b}dd{margin:0;font-weight:700}
.ver{text-align:center;color:#94a3b8;font-size:12px;margin:26px 0 0;line-height:1.7}
#pv .pg{position:relative;margin:8px 0}#pv .pg::after{content:"";position:absolute;inset:0}
#pv canvas{width:100%;display:block;border:1px solid #cbd5e1;background:#fff;-webkit-touch-callout:none}
.bigck{width:96px;height:96px}.steps{text-align:left;background:#f1f5f9;border-radius:12px;padding:12px 16px;margin:14px 0;font-size:14px;line-height:1.7}.steps ol{margin:6px 0 0;padding-left:20px}
.subt{margin:-6px 0 10px;color:#475569;font-size:15px;white-space:pre-wrap}
.lk{flex:none;width:22px}.lk svg{width:22px;fill:#b45309}
.lockbox{position:relative;border-radius:14px;overflow:hidden;background:#e2e8f0;margin:12px 0;min-height:220px}.lockbox img{width:100%;display:block}
.fake{height:300px;background:repeating-linear-gradient(#cbd5e1 0 10px,#e2e8f0 10px 26px)}
.lkov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#0f172a99;color:#fff;text-align:center;padding:16px}.lkov svg{width:60px;fill:#fff}
.brand{display:flex;align-items:center;gap:10px;font-size:30px;font-weight:800;color:#1e3a8a;letter-spacing:.5px}.brand.sm{font-size:20px;margin-bottom:6px}.kana{font-size:12px;color:#64748b;margin:0 0 14px 54px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;background:#e2e8f0;border-radius:10px;padding:3px}.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;color:#64748b}.seg .on{background:#fff;color:#1d4ed8;box-shadow:0 1px 2px #0002}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:10px}
.tile{position:relative;aspect-ratio:1;background:#fff;border-radius:18px;box-shadow:0 1px 3px #0001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;text-align:center;cursor:pointer}
.tile b{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.tile .ic{width:68px;height:68px;font-size:14px;border-radius:16px}.tile .ic.f svg{width:46px}.tile .ic.f .mk{font-size:16px;padding-top:6px}
.tile .lk.tl{position:absolute;top:10px;right:10px}
.fsx{display:none}
#pvw.full{position:fixed;inset:0;z-index:1000;background:#1e293b;overflow:auto;padding:0 12px 24px}
#pvw.full .fsx{display:block;position:sticky;top:0;z-index:2;margin:10px 0 8px auto}
#pvw.full #pv{max-width:1000px;margin:0 auto}
.nosel{user-select:none;-webkit-user-select:none}
dialog{width:min(560px,94vw);border:0;border-radius:16px;padding:20px}dialog::backdrop{background:#0008}
@media print{body{display:none!important}}
[hidden]{display:none!important}
.ib{padding:9px 12px;display:inline-flex;align-items:center;justify-content:center}
.syncb{margin-left:auto;background:none;border:0;color:#fff;padding:6px;border-radius:10px;display:flex}.syncb.spin svg{animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.seg button{display:inline-flex;align-items:center}
.sbar{margin:8px 0 6px}.sin{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 6px 0 12px;box-shadow:0 1px 3px #0001;color:#94a3b8}
.sin input,.sin input:focus{border:0;margin:0;padding:12px 4px;flex:1;background:none;border-radius:0;min-width:0}
.sf{border:0;background:none;color:#64748b;padding:8px;border-radius:10px;display:flex}
.spn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.spn select{margin:0;padding:10px;font-size:14px}
.gc{display:inline-block;color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.tile .gc{margin:0}
.openb{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;padding:18px;margin:14px 0}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0f172af0;color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;z-index:1300;max-width:90%;text-align:center}
.viewer{position:fixed;inset:0;z-index:1000;background:#1e293b;display:flex;flex-direction:column;color:#fff}
.vbar{display:flex;align-items:center;gap:4px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:#0f172a}
.vt{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vpn{font-size:12px;color:#94a3b8;margin-right:4px}
.vi{background:none;border:0;color:#fff;padding:8px;border-radius:10px;display:flex}.vi:active{background:#334155}
.vscroll{flex:1;overflow:auto;touch-action:none;background:#334155;position:relative}
.vpages{margin:0 auto}.vld{text-align:center;color:#cbd5e1;padding:40px 12px}
.vpg{position:relative;margin:8px 0;background:#fff;line-height:0}.vpg canvas{position:absolute;inset:0;width:100%;height:100%}
.vpg .mkl{mix-blend-mode:multiply;opacity:.5}.vstl{position:absolute;inset:0}
.stk{position:absolute;transform:translate(-50%,-50%);min-width:30px;min-height:30px;padding:4px 7px;font-size:12px;line-height:1.2;color:#78350f;border-radius:6px 6px 14px 6px;box-shadow:0 2px 6px #0004;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.vdock{background:#0f172a;padding:6px 8px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.vtools{display:flex;justify-content:space-around}.vtools button{background:none;border:0;color:#cbd5e1;padding:10px 12px;border-radius:12px;display:flex}.vtools .on{background:#2563eb;color:#fff}
.vopt{display:flex;justify-content:center;align-items:center;gap:10px}.vopt:not(:empty){padding-bottom:8px}.vsp{width:12px}
.dotc{width:28px;height:28px;border-radius:50%;border:3px solid transparent;padding:0}.dotc.on{border-color:#fff;box-shadow:0 0 0 1px #0006}.vmodal .dotc.on{border-color:#0f172a}
.sdt{background:#334155;border:0;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;padding:0}.sdt i{display:block;background:#fff;border-radius:50%}.sdt.on{background:#2563eb}
.vmodal{position:absolute;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}.vmodal .card{color:#0f172a;width:min(420px,100%);cursor:auto}
.vmodal textarea{margin-bottom:10px}.row3{display:flex;align-items:center;gap:8px}
</style></head><body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="common.js?v=3.1.0"></script>
<script src="legal.js?v=3.1.0"></script>
<script>
function fixReload(){Promise.resolve(typeof auth!='undefined'&&auth.signOut()).finally(()=>location.reload())}
window.onerror=m=>{document.body.insertAdjacentHTML('afterbegin','<div style="color:#dc2626;padding:14px;white-space:pre-wrap;font:14px sans-serif">エラー: '+String(m)+'\n\nCtrl+Shift+R で再読み込みしても直らないときは、このメッセージを開発者に伝えてください。\n<button onclick="fixReload()" style="margin-top:8px;padding:8px 14px">ログアウトして再読み込み</button></div>')};
window.addEventListener('unhandledrejection',ev=>window.onerror('読み込み中に問題が起きました: '+((ev.reason&&ev.reason.message)||ev.reason)));
// 利用者サイトは標準のFirebaseアプリを使う(管理者サイトは別名のアプリなのでログインが干渉しません)
const auth=firebase.auth(),db=firebase.firestore();
const mail=id=>id.toLowerCase()+'@hayaken.app';
const pwOK=p=>p.length>=8&&[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p)).length>=2;
const PWMSG='他のサービスと同じパスワードの使いまわしは避けてください。8文字以上で、大文字・小文字・数字・記号のうち2種類以上を使ってください。';
const days=x=>x?Math.ceil((new Date(x+'T23:59:59')-new Date())/864e5):null;
const forMe=n=>n.to.includes('all')||n.to.includes(PID)||(n.future&&(P.createdAt||0)>n.createdAt);
const rnd=()=>Math.random().toString(36).slice(2,8);
let U=null,P=null,PID=null,HM=false,items=[],path=[],tab='shelf',busy=false,cur=null,LR={};
const show=h=>$('#app').innerHTML=h;
const err=(m,ok)=>{const x=$('#er');if(x){x.textContent=m;x.style.color=ok?'#166534':''}};
loadLegal();

/* ---------- ログイン・新規登録 ---------- */
function loginView(m=''){show(`<div class=auth><div class=box>${brandHtml('#1d4ed8')}<p class=kana>ぶりぶりー</p><p class=sub>ログインしてください</p>
<label>ログインID(学籍番号)</label><input id=li autocomplete=username>
<label>パスワード</label><input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')doLogin()">
<p id=er class=err>${e(m)}</p><button class="b big" onclick=doLogin()>ログイン</button>
<p style="text-align:center;margin:10px 0"><a href=# onclick="resetView();return false" style="color:#1d4ed8;font-size:14px">パスワードを忘れた方はこちら</a></p>
<div class=or>はじめての方</div><button class="b g big" onclick=regView()>新規登録</button></div></div>`)}
async function doLogin(){
  const sid=$v('#li').trim();if(!/^[A-Za-z0-9]+$/.test(sid))return err('IDまたはパスワードが違います');
  try{
    let em=mail(sid);
    try{const s=await db.doc('sids/'+sid.toLowerCase()).get();if(s.exists)em=s.data().email}catch(x){}
    await auth.signInWithEmailAndPassword(em,$v('#lp'));
  }catch(x){err('IDまたはパスワードが違います')}
}

/* ---------- パスワードを忘れたとき ---------- */
function resetView(mode='req'){show(`<div class=auth><div class=box>${brandHtml('#1d4ed8','#fff',1)}<h1 class=lg>パスワードを忘れたとき</h1>
<div class=two style="margin:10px 0 16px"><button class="b ${mode=='req'?'':'g'}" onclick="resetView('req')">1. 申請する</button><button class="b ${mode=='code'?'':'g'}" onclick="resetView('code')">2. コードを入力</button></div>
${mode=='req'?`<p class=sub>学籍番号を入力して申請すると、管理者(はやけん)に届きます。本人確認のあと、リセット用のコード(8桁)を教えてもらえます。申請したあとは、画面を閉じても大丈夫です。</p>
<label>学籍番号</label><input id=rs><p id=er class=err></p><button class="b big" onclick=reqReset()>申請する</button>`:
`<p class=sub>管理者から教えてもらったコードで、新しいパスワードを設定します。コードは発行から7日間使えます。申請のときと同じ画面でなくても大丈夫です。</p>
<label>学籍番号</label><input id=rs><label>リセットコード(8桁)</label><input id=rc inputmode=numeric maxlength=8>
<label>新しいパスワード</label><input id=p1 type=password><p class=s style="margin:-8px 0 12px">${PWMSG}</p>
<label>新しいパスワード(確認)</label><input id=p2 type=password>
<p id=er class=err></p><button class="b big" onclick=doReset()>パスワードを再設定</button>`}
<button class="b g big" onclick="loginView()">ログインに戻る</button></div></div>`)}
async function reqReset(){
  const sid=$v('#rs').trim();if(!/^[A-Za-z0-9]+$/.test(sid))return err('学籍番号を入力してください');
  try{await db.collection('inbox').add({type:'reset',sid:sid.toLowerCase(),at:Date.now()});resetDone()}
  catch(x){err('申請できませんでした。しばらくしてからもう一度お試しください')}
}
function resetDone(){show(`<div class=auth><div class=box style="text-align:center">
<svg class=bigck viewBox="0 0 52 52"><circle cx="26" cy="26" r="24" fill="#16a34a"/><path d="M14 27l8 8 16-17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h1 class=lg style="margin-top:14px">申請を送りました</h1><p class=sub>管理者(はやけん)に、パスワード再設定の申請が届きました。</p>
<div class=steps><b>このあとの流れ</b><ol><li>管理者から、8桁の「リセットコード」を教えてもらいます。本人確認があるので、はやけんに直接聞いてください。</li><li>コードをもらったら、下の「コードを入力する」を押して、新しいパスワードを設定します。</li></ol></div>
<p class=s>この画面は閉じても大丈夫です。コードは発行から7日間使えます。あとからでも、ログイン画面の「パスワードを忘れた方」→「2. コードを入力」で設定できます。</p>
<button class="b big" onclick="resetView('code')">コードを入力する</button><button class="b g big" onclick="loginView()">ログインに戻る</button></div></div>`)}
async function doReset(){
  const sk=$v('#rs').trim().toLowerCase(),code=$v('#rc').trim(),p=$v('#p1');
  if(!/^[a-z0-9]+$/.test(sk)||!/^\d{8}$/.test(code))return err('学籍番号とコード(8桁)を入力してください');
  if(!pwOK(p))return err('パスワードが条件を満たしていません');
  if(p!==$v('#p2'))return err('確認用パスワードが一致しません');
  const key=sk+'_'+code;let r=null;
  try{r=await db.doc('resets/'+key).get()}catch(x){}
  if(!r||!r.exists||r.data().exp<Date.now())return err('コードが違うか、期限が切れています');
  const pid=r.data().pid,email=sk+'-'+rnd()+'@hayaken.app';busy=true;let c;
  try{c=await auth.createUserWithEmailAndPassword(email,p)}catch(x){busy=false;return err('再設定できませんでした。もう一度お試しください')}
  try{
    const b=db.batch(),uid=c.user.uid;
    b.update(db.doc('users/'+pid),{authUid:uid,resetKey:key});
    b.set(db.doc('sids/'+sk),{pid,email,resetKey:key});
    b.set(db.doc('authmap/'+uid),{pid});
    b.delete(db.doc('resets/'+key));
    b.set(db.collection('inbox').doc(),{type:'reset_done',uid:pid,sid:sk,at:Date.now()});
    await b.commit();
  }catch(x){await c.user.delete();busy=false;return err('再設定できませんでした。もう一度お試しください')}
  busy=false;boot(c.user);
}

/* ---------- 新規登録 ---------- */
function regView(){LR={};show(`<div class=auth><div class=box>${brandHtml('#1d4ed8','#fff',1)}<h1 class=lg>新規登録</h1><p class=sub>すべて必須です</p>
<div class=two><div><label>姓</label><input id=ln></div><div><label>名</label><input id=fn></div></div>
<label>学籍番号(ログインIDになります)</label><input id=sid>
<label>パスワード</label><input id=p1 type=password><p class=s style="margin:-8px 0 12px">${PWMSG}</p>
<label>パスワード(確認)</label><input id=p2 type=password>
<label>シリアルコード(8桁)</label><input id=sc inputmode=numeric maxlength=8>
<p class=s style="margin:-8px 0 14px">シリアルコードは、はやけんに聞いて、教えてもらってください。</p>
<p class=s style="margin:0 0 6px">登録するには、2つとも開いて内容を確認してください</p>
<div class=two><button class="b g" id=lt onclick="rdLegal('t')">利用規約を読む</button><button class="b g" id=lp2 onclick="rdLegal('p')">プライバシーポリシーを読む</button></div>
<p id=er class=err></p>
<button id=rb class="b big" onclick=doReg() disabled><small>利用規約・プライバシーポリシーに同意して</small>登録</button>
<button class="b g big" onclick="loginView()">戻る</button></div></div>`)}
function rdLegal(k){
  showLegal(k=='t'?'利用規約':'プライバシーポリシー',k=='t'?TERMS:PRIV);LR[k]=1;
  const b=$(k=='t'?'#lt':'#lp2');b.textContent='確認済み';b.classList.add('ok');$('#rb').disabled=!(LR.t&&LR.p);
}
// 登録できる学籍番号: 0000000〜0000010 と、2021001〜2026250(各年 001〜250)
const sidOK=s=>{if(!/^\d{7}$/.test(s))return false;const n=+s;return n<=10||[2021,2022,2023,2024,2025,2026].some(y=>n>=y*1000+1&&n<=y*1000+250)};
async function doReg(){
  const ln=$v('#ln').trim(),fn=$v('#fn').trim(),sid=$v('#sid').trim(),p=$v('#p1'),sc=$v('#sc').trim();
  if(!ln||!fn||!sid||!p||!sc)return err('すべて入力してください');
  if(!sidOK(sid))return err('学籍番号が正しくありません');
  if(!pwOK(p))return err('パスワードが条件を満たしていません');
  if(p!==$v('#p2'))return err('確認用パスワードが一致しません');
  if(!/^\d{8}$/.test(sc))return err('シリアルコードは8桁の数字です');
  const sk=sid.toLowerCase(),bt=$('#rb');
  try{if((await db.doc('sids/'+sk).get()).exists)return err('この学籍番号は、すでに登録されています')}catch(x){}
  const email=sk+'-'+rnd()+'@hayaken.app';bt.disabled=true;busy=true;let c;
  try{c=await auth.createUserWithEmailAndPassword(email,p)}catch(x){busy=false;bt.disabled=false;return err('登録できませんでした。もう一度お試しください')}
  try{
    const uid=c.user.uid,b=db.batch();
    b.update(db.doc('serials/'+sc),{usedBy:uid});

// --- 道具 ---
function setTool(t){V.tool=t;document.querySelectorAll('.vtools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));vOpt()}
function vOpt(){const o=$('#vopt'),t=V.tool;if(!o)return;if(t!='pen'&&t!='mk'){o.innerHTML='';return}
  const cols=t=='pen'?PCOL:MCOL,cur=t=='pen'?V.pc:V.mc,szs=t=='pen'?PSZ:MSZ,cw=t=='pen'?V.pw:V.mw;
  o.innerHTML=cols.map(c=>`<button class="dotc ${c==cur?'on':''}" style="background:${c}" onclick="vCol('${c}')"></button>`).join('')+'<span class=vsp></span>'+szs.map((w,i)=>`<button class="sdt ${w==cw?'on':''}" onclick="vSz(${w})"><i style="width:${[5,9,14][i]}px;height:${[5,9,14][i]}px"></i></button>`).join('')}
function vCol(c){if(V.tool=='pen')V.pc=c;else V.mc=c;vOpt()}
function vSz(w){if(V.tool=='pen')V.pw=w;else V.mw=w;vOpt()}
// --- 指・ペンの動き ---
const pageAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest?el.closest('.vpg'):null};
const norm=(pg,x,y)=>{const r=pg.getBoundingClientRect();return[cl((x-r.left)/r.width),cl((y-r.top)/r.height)]};
function vDown(ev){
  const s=$('#vs');if(ev.pointerType=='mouse')PT.clear();
  s.setPointerCapture(ev.pointerId);PT.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(PT.size>=2){endStroke(true);const [a,b]=[...PT.values()];V.g={t:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:V.z,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};return}
  const sk=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.stk');
  if(sk){V.g={t:'stk',id:sk.dataset.id,x:ev.clientX,y:ev.clientY,moved:false};return}
  const pg=pageAt(ev.clientX,ev.clientY),T=V.tool;
  if(T=='hand'||!pg){V.g={t:'pan',x:ev.clientX,y:ev.clientY,sl:s.scrollLeft,st:s.scrollTop};return}
  if(T=='pen'||T=='mk'){
    const [x,y]=norm(pg,ev.clientX,ev.clientY),mk=T=='mk';
    const st={p:+pg.dataset.p,k:mk?'m':'p',c:mk?V.mc:V.pc,w:mk?V.mw:V.pw,pts:[Math.round(x*1e4),Math.round(y*1e4)]};
    V.g={t:'draw',pg,s:st};liveSeg(st,pg);
  }else if(T=='er'){V.g={t:'er',pg,del:[]};eraseAt(ev)}
  else if(T=='stk'){V.g={t:'add',pg,x:ev.clientX,y:ev.clientY}}
}
function vMove(ev){
  if(!PT.has(ev.pointerId))return;PT.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});const g=V.g;if(!g)return;const s=$('#vs');
  if(g.t=='pinch'){if(PT.size<2)return;const [a,b]=[...PT.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=s.getBoundingClientRect();
    setZoom(g.z*d/g.d,cx-r.left,cy-r.top);s.scrollLeft-=cx-g.cx;s.scrollTop-=cy-g.cy;g.cx=cx;g.cy=cy;return}
  if(g.t=='pan'){s.scrollLeft=g.sl-(ev.clientX-g.x);s.scrollTop=g.st-(ev.clientY-g.y)}
  else if(g.t=='draw'){const [x,y]=norm(g.pg,ev.clientX,ev.clientY),p=g.s.pts,asp=+g.pg.dataset.a;
    if(Math.hypot(x-p[p.length-2]/1e4,(y-p[p.length-1]/1e4)*asp)<.0012)return;p.push(Math.round(x*1e4),Math.round(y*1e4));liveSeg(g.s,g.pg)}
  else if(g.t=='er')eraseAt(ev);
  else if(g.t=='stk'&&Math.hypot(ev.clientX-g.x,ev.clientY-g.y)>6){g.moved=true;moveStk(g.id,ev)}
}
function vUp(ev){
  PT.delete(ev.pointerId);const g=V.g;if(!g)return;
  if(g.t=='pinch'){if(PT.size<2)V.g=null;return}
  if(g.t=='draw')endStroke(false);
  else if(g.t=='er'){if(g.del.length){V.hist.push({del:g.del});vSave()}}
  else if(g.t=='stk'){if(!g.moved)editStk(g.id);else vSave()}
  else if(g.t=='add'){if(Math.hypot(ev.clientX-g.x,ev.clientY-g.y)<8)addStk(g.pg,ev)}
  V.g=null;
}
function endStroke(cancel){const g=V.g;if(!g||g.t!='draw')return;V.g=null;
  if(cancel){redraw(g.s.p);return}
  V.strokes.push(g.s);V.hist.push({add:g.s});vSave()}
// --- 描画 ---
function liveSeg(s,pg){const c=pg.querySelector(s.k=='m'?'.mkl':'.penl'),W=c.width,H=c.height,x=c.getContext('2d'),n=s.pts.length;
  x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w*W;x.lineCap=x.lineJoin='round';x.beginPath();
  if(n<4){x.arc(s.pts[0]/1e4*W,s.pts[1]/1e4*H,s.w*W/2,0,7);x.fill()}
  else{x.moveTo(s.pts[n-4]/1e4*W,s.pts[n-3]/1e4*H);x.lineTo(s.pts[n-2]/1e4*W,s.pts[n-1]/1e4*H);x.stroke()}}
function drawStroke(x,s){const W=x.canvas.width,H=x.canvas.height,p=s.pts;x.strokeStyle=x.fillStyle=s.c;x.lineWidth=s.w*W;x.lineCap=x.lineJoin='round';x.beginPath();
  if(p.length<4){x.arc(p[0]/1e4*W,p[1]/1e4*H,s.w*W/2,0,7);x.fill()}
  else{x.moveTo(p[0]/1e4*W,p[1]/1e4*H);for(let i=2;i<p.length;i+=2)x.lineTo(p[i]/1e4*W,p[i+1]/1e4*H);x.stroke()}}
function redraw(p){const pg=document.querySelector(`.vpg[data-p="${p}"]`);if(!pg)return;
  const m=pg.querySelector('.mkl'),n=pg.querySelector('.penl');m.getContext('2d').clearRect(0,0,m.width,m.height);n.getContext('2d').clearRect(0,0,n.width,n.height);
  V.strokes.filter(s=>s.p==p).forEach(s=>drawStroke((s.k=='m'?m:n).getContext('2d'),s))}
function eraseAt(ev){const g=V.g,[x,y]=norm(g.pg,ev.clientX,ev.clientY),pn=+g.pg.dataset.p,asp=+g.pg.dataset.a;
  const hit=V.strokes.filter(s=>s.p==pn&&s.pts.some((v,i)=>i%2==0&&Math.hypot(v/1e4-x,(s.pts[i+1]/1e4-y)*asp)<.02+s.w/2));
  if(hit.length){hit.forEach(s=>{V.strokes.splice(V.strokes.indexOf(s),1);g.del.push(s)});redraw(pn)}}
function vUndo(){const h=V.hist.pop();if(!h)return toast('もとに戻せる操作がありません');
  if(h.add){const i=V.strokes.indexOf(h.add);if(i>=0)V.strokes.splice(i,1);redraw(h.add.p)}
  else{const l=h.del||h.clr;l.forEach(s=>V.strokes.push(s));new Set(l.map(s=>s.p)).forEach(redraw)}
  vSave()}
function vClear(){if(!V.strokes.length)return toast('消す書き込みがありません');
  if(!confirm('ペンとマーカーの書き込みを、すべて消しますか?'))return;
  const all=V.strokes.splice(0);V.hist.push({clr:all});new Set(all.map(s=>s.p)).forEach(redraw);vSave()}
// --- 付箋 ---
function drawStk(){document.querySelectorAll('.vpg').forEach(pg=>{pg.querySelector('.vstl').innerHTML=V.stk.filter(s=>s.p==+pg.dataset.p).map(s=>
  `<div class=stk data-id="${s.id}" style="left:${s.x*100}%;top:${s.y*100}%;background:${s.c}">${s.t?e([...s.t].slice(0,8).join('')):IC(I.stk,16)}</div>`).join('')})}
function addStk(pg,ev){const [x,y]=norm(pg,ev.clientX,ev.clientY),s={id:'s'+Date.now().toString(36),p:+pg.dataset.p,x,y,t:'',c:SCOL[0]};V.stk.push(s);drawStk();editStk(s.id,true)}
function moveStk(id,ev){const s=V.stk.find(x=>x.id==id),pg=document.querySelector(`.vpg[data-p="${s.p}"]`),[x,y]=norm(pg,ev.clientX,ev.clientY);s.x=x;s.y=y;
  const el=pg.querySelector(`.stk[data-id="${id}"]`);if(el){el.style.left=x*100+'%';el.style.top=y*100+'%'}}
function editStk(id,isNew){
  const s=V.stk.find(x=>x.id==id);if(!s)return;let col=s.c;
  const m=document.createElement('div');m.className='vmodal';
  m.innerHTML=`<div class=card><textarea id=stx rows=4 maxlength=300 placeholder="メモ">${e(s.t)}</textarea><div class=row3>${SCOL.map(c=>`<button class="dotc ${c==col?'on':''}" style="background:${c}" data-c="${c}"></button>`).join('')}<span class=vsp></span><button class="b r ib" id=sdel>${IC(I.trash,18)}</button><button class="b ib" id=sok>${IC(I.check,18)}</button></div></div>`;
  $('#vw').append(m);const ta=m.querySelector('#stx');ta.focus();
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=b.dataset.c;m.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x==b))});
  m.querySelector('#sdel').onclick=()=>{V.stk=V.stk.filter(x=>x.id!=id);m.remove();drawStk();vSave()};
  m.querySelector('#sok').onclick=()=>{s.t=ta.value;s.c=col;if(isNew&&!s.t.trim())V.stk=V.stk.filter(x=>x.id!=id);m.remove();drawStk();vSave()};
}
// --- 保存(自分だけ見られる。ファイルが新しい版になっても、そのまま引き継がれる) ---
let _st=null;
function vSave(){V.dirty=true;clearTimeout(_st);_st=setTimeout(vFlush,1200)}
async function vFlush(){
  if(!V.dirty||!V.it)return;V.dirty=false;
  const it=V.it,data={pid:PID,itemId:it.id,strokes:V.strokes,stk:V.stk,ver:it.version,updatedAt:Date.now()};
  if(JSON.stringify(data).length>900000)return toast('書き込みが多すぎて保存できません。一部を消してください');
  try{await db.doc('notes/'+PID+'_'+it.id).set(data);await db.doc('nmeta/'+PID).set({m:{[it.id]:data.updatedAt}},{merge:true});NM[it.id]=data.updatedAt}
  catch(x){V.dirty=true;toast('保存できませんでした')}
}
// --- ダウンロード・印刷(名前とシリアルコードの透かし入りPDFを作り、別タブで開く) ---
function vDl(){
  if(!V.strokes.length)return dl(false);
  const m=document.createElement('div');m.className='vmodal';
  m.innerHTML=`<div class=card style="text-align:center"><button class="b big" onclick="dl(true)">書き込みも入れる</button><button class="b g big" onclick="dl(false)">元のPDFのまま</button><button class="b g ib" onclick="this.closest('.vmodal').remove()">${IC(I.close,18)}</button></div>`;
  $('#vw').append(m);
}
async function dl(ink){
  document.querySelector('.vmodal')?.remove();
  if(!PDFDOC)return;
  try{
    await loadLib('pdflib');
    const out=await PDFLib.PDFDocument.create(),txt=P.last+' '+P.first+'  /  '+P.serial,n=PDFDOC.numPages;
    for(let i=1;i<=n;i++){
      toast(`作成中… ${i}/${n}`,true);
      const pg=await PDFDOC.getPage(i),v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:2.2}),c=document.createElement('canvas');
      c.width=vp.width;c.height=vp.height;const x=c.getContext('2d');
      await pg.render({canvasContext:x,viewport:vp,intent:'print'}).promise; // 他のタブを見ていても止まらない描画方法
      if(ink){
        const m=document.createElement('canvas');m.width=c.width;m.height=c.height;const mx=m.getContext('2d');
        V.strokes.filter(s=>s.p==i&&s.k=='m').forEach(s=>drawStroke(mx,s));
        x.save();x.globalAlpha=.5;x.globalCompositeOperation='multiply';x.drawImage(m,0,0);x.restore();
        V.strokes.filter(s=>s.p==i&&s.k=='p').forEach(s=>drawStroke(x,s));
      }
      x.font=Math.round(vp.width/55)+'px sans-serif';x.fillStyle='rgba(0,0,0,.5)';x.textAlign='center';x.fillText(txt,vp.width/2,vp.height*0.985);
      const img=await out.embedJpg(c.toDataURL('image/jpeg',.92));
      out.addPage([v1.width,v1.height]).drawImage(img,{x:0,y:0,width:v1.width,height:v1.height}); // 元のPDFと同じサイズ・向き
    }
    toast('仕上げ中…',true);
    const url=URL.createObjectURL(new Blob([await out.save()],{type:'application/pdf'}));
    if(window.open(url,'_blank'))toast('別のタブで開きました');
    else toast(`<a class="b" href="${url}" target="_blank" onclick="toast('開きました')" style="text-decoration:none;color:#fff">PDFを開く</a>`,true);
  }catch(x){toast('作成できませんでした')}
}
// スクリーンショット・右クリック対策(完全には防げません)
document.addEventListener('visibilitychange',()=>{document.body.style.filter=document.hidden?'blur(20px)':''});
window.addEventListener('blur',()=>document.body.style.filter='blur(20px)');
window.addEventListener('focus',()=>document.body.style.filter='');
document.addEventListener('keyup',k=>{if(k.key=='PrintScreen'){navigator.clipboard?.writeText('');alert('スクリーンショットは禁止されています')}});
document.addEventListener('contextmenu',ev=>{if(ev.target.closest&&ev.target.closest('#vw,.lockbox'))ev.preventDefault()});

/* ---------- お知らせ(全員宛てのものは、登録前に送られたものも見られます) ---------- */
async function news(){
  const l=(await db.collection('notices').get()).docs.map(d=>({id:d.id,...d.data()})).filter(forMe).sort((a,b)=>b.createdAt-a.createdAt);
  window._n=l;
  $('#m').innerHTML='<h2>お知らせ</h2>'+(l.map((n,i)=>`<div class=it onclick=nd(${i}) style="display:block"><span class=chip style="background:${G[n.genre]||'#666'}">${e(n.genre)}</span><b>${e(n.subject)}</b><div class=s>${fmt(n.createdAt)}</div></div>`).join('')||'<p class=s>お知らせはありません</p>');
}
function nd(i){const n=_n[i];$('#m').innerHTML=`<button class="b g" onclick=news()>戻る</button><h2>${e(n.subject)}</h2><span class=chip style="background:${G[n.genre]||'#666'}">${e(n.genre)}</span><span class=s>${fmt(n.createdAt)}</span><div class=card style="white-space:pre-wrap">${e(n.body)}</div>`}

/* ---------- マイページ ---------- */
function me(){
  $('#m').innerHTML=`<h2>マイページ</h2>
  <div class=card><dl><dt>名前</dt><dd>${e(P.last+' '+P.first)}</dd><dt>ログインID</dt><dd>${e(P.sid)}</dd><dt>シリアルコード</dt><dd>${e(P.serial)}</dd><dt>パスワード</dt><dd>********</dd></dl></div>
  <details><summary>パスワードを変更する</summary><input id=op type=password placeholder=現在のパスワード><input id=n1 type=password placeholder=新しいパスワード><input id=n2 type=password placeholder=新しいパスワード(確認)>
   <p class=s>${PWMSG}</p><button class="b big" onclick=chgPw()>変更する</button></details>
  <details><summary>管理者に連絡・相談する</summary>
   <label>名前</label><input value="${e(P.last+' '+P.first)}" disabled>
   <label>内容</label><select id=cc><option>アプリの修正希望・バグ報告</option><option>ファイル(教材)の修正希望・バグ報告</option><option>その他</option></select>
   <label>件名</label><input id=cs>
   <label>本文</label><textarea id=cb rows=4></textarea>
   <label><input type=checkbox id=cr>返信を希望する</label><p class=s>返信はお知らせページでお知らせします。内容によっては返信できない場合があります。</p>
   <button class="b big" onclick=send()>管理者に送信</button></details>
  <details><summary>退会・アカウント削除</summary><label>退会の理由・ご意見(任意)</label><textarea id=wr rows=3></textarea>
   <button class="b r big" onclick=withdraw()>退会・アカウント削除</button></details>
  <div class=card><button class="b g" onclick="showLegal('利用規約',TERMS)">利用規約</button><button class="b g" onclick="showLegal('プライバシーポリシー',PRIV)">プライバシーポリシー</button></div>
  <button class="b g" onclick="auth.signOut()">ログアウト</button>${verHtml()}`;
}
async function reauth(p){await U.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(U.email,p))}
async function chgPw(){
  if(!pwOK($v('#n1')))return alert('新しいパスワードが条件を満たしていません');
  if($v('#n1')!==$v('#n2'))return alert('確認用パスワードが一致しません');
  try{await reauth($v('#op'));await U.updatePassword($v('#n1'));alert('変更しました');me()}catch(x){alert('現在のパスワードが違います')}
}
async function send(){
  if(!$v('#cs').trim()||!$v('#cb').trim())return alert('件名と本文を入力してください');
  await db.collection('inbox').add({type:'contact',uid:PID,name:P.last+' '+P.first,sid:P.sid,category:$v('#cc'),subject:$v('#cs').trim(),body:$v('#cb'),wantReply:$('#cr').checked,at:Date.now()});
  alert('送信しました');me();
}
async function withdraw(){
  if(!confirm('本当に退会しますか?この操作は取り消せません。'))return;
  const p=prompt('確認のため現在のパスワードを入力してください');if(!p)return;
  try{await reauth(p)}catch(x){return alert('パスワードが違います')}
  const sk=(P.sidKey||P.sid.toLowerCase()),b=db.batch();
  b.set(db.collection('inbox').doc(),{type:'withdraw',uid:PID,name:P.last+' '+P.first,sid:P.sid,body:$v('#wr'),at:Date.now()});
  b.delete(db.doc('users/'+PID));
  try{if((await db.doc('sids/'+sk).get()).exists)b.delete(db.doc('sids/'+sk))}catch(x){}
  if(HM)b.delete(db.doc('authmap/'+U.uid));
  await b.commit();await U.delete();alert('退会しました');
}
